<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezz Chat - Live Messaging</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 95vh; }
        #chat-box { flex: 1; border: 1px solid #333; border-radius: 8px; padding: 10px; overflow-y: auto; margin-bottom: 10px; background: #1e1e1e; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 75%; word-wrap: break-word; }
        .my-message { background: #0084ff; margin-right: auto; }
        .input-container { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
        button { padding: 10px 20px; border-radius: 6px; border: none; background: #0084ff; color: #fff; font-weight: bold; cursor: pointer; }
    </style>

    <!-- استدعاء مكتبات Firebase للويب -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // بيانات مشروعك الحقيقية:
        const firebaseConfig = {
            apiKey: "AIzaSyDLF49WQ...",
            authDomain: "ezzchat-6132...",
            projectId: "ezzchat-6132...",
            storageBucket: "ezzchat-6132...",
            messagingSenderId: "11816...",
            appId: "1:9ccb2af48923..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // وظيفة إرسال الرسالة وحفظها في قاعدة البيانات
        window.sendMessage = async function() {
            const input = document.getElementById('messageInput');
            
            if (input.value.trim() !== "") {
                try {
                    await addDoc(collection(db, "Chats"), {
                        sender: "Ezadeen",
                        message: input.value,
                        timestamp: Date.now()
                    });
                    input.value = "";
                } catch (e) {
                    alert("Error: " + e.message);
                }
            }
        }

        // جلب الرسائل وعرضها بشكل فوري ومباشر من قاعدة البيانات
        const q = query(collection(db, "Chats"), orderBy("timestamp", "asc"));
        onSnapshot(q, (snapshot) => {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message my-message';
                msgDiv.innerText = `${data.sender}: ${data.message}`;
                chatBox.appendChild(msgDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</head>
<body>

    <h2>Ezz Chat 💬</h2>
    <div id="chat-box"></div>

    <div class="input-container">
        <input type="text" id="messageInput" placeholder="Type your message here...">
        <button onclick="sendMessage()">Send</button>
    </div>

</body>
</html>
